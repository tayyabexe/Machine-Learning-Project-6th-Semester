<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="44" viewBox="0 0 1200 44" role="img" aria-label="section divider">
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6b7280" stop-opacity="0"/>
      <stop offset="0.25" stop-color="#6b7280">
        <animate attributeName="stop-color" values="#6b7280;#3b82f6;#f59e0b;#6b7280" dur="7s" repeatCount="indefinite"/>
      </stop>
      <stop offset="0.5" stop-color="#3b82f6">
        <animate attributeName="stop-color" values="#3b82f6;#f59e0b;#6b7280;#3b82f6" dur="7s" repeatCount="indefinite"/>
      </stop>
      <stop offset="0.75" stop-color="#60a5fa">
        <animate attributeName="stop-color" values="#60a5fa;#6b7280;#3b82f6;#60a5fa" dur="7s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#6b7280" stop-opacity="0"/>
    </linearGradient>
    <style>
      .drift { animation: drift 12s linear infinite; }
      .bob   { animation: bob 2.4s ease-in-out infinite alternate; }
      .spin  { animation: spin 5s linear infinite; transform-box: fill-box; transform-origin: center; }
      @keyframes drift { from { transform: translateX(-40px); } to { transform: translateX(1240px); } }
      @keyframes bob   { from { transform: translateY(-6px); } to { transform: translateY(6px); } }
      @keyframes spin  { to { transform: rotate(360deg); } }
    </style>
  </defs>
  <rect x="0" y="21" width="1200" height="2" rx="1" fill="url(#line)"/>
  <g class="drift"><g class="bob"><g class="spin">
    <path transform="translate(0,22)" d="M0,-9 C5,-7 8,-2 7,4 C5,8 2,9 0,11 C-2,9 -5,8 -7,4 C-8,-2 -5,-7 0,-9 Z" fill="#d97706"/>
  </g></g></g>
</svg>
