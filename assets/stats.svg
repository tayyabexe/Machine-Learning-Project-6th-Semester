<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="150" viewBox="0 0 1200 150" role="img" aria-label="Project at a glance: 3 datasets, 1,189,677 rows, 7 targets, 14 models">
  <defs>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4b5563">
        <animate attributeName="stop-color" values="#4b5563;#3b82f6;#f59e0b;#4b5563" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#3b82f6">
        <animate attributeName="stop-color" values="#3b82f6;#f59e0b;#4b5563;#3b82f6" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="num" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e5e7eb">
        <animate attributeName="stop-color" values="#e5e7eb;#93c5fd;#fbbf24;#e5e7eb" dur="9s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#60a5fa">
        <animate attributeName="stop-color" values="#60a5fa;#fbbf24;#e5e7eb;#60a5fa" dur="9s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <style>
      .f { font-family: 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; }
      .card { fill: #0f172a; stroke: url(#edge); stroke-width: 1.5; }
      .n { font-size: 40px; font-weight: 800; fill: url(#num); }
      .l { font-size: 14px; fill: #94a3b8; letter-spacing: 1.5px; }
      .pop { animation: pop 0.9s cubic-bezier(.2,.9,.3,1.3) both; transform-box: fill-box; transform-origin: center; }
      @keyframes pop { from { opacity: 0; transform: translateY(16px) scale(0.96); } to { opacity: 1; transform: translateY(0) scale(1); } }
      .float { animation: float 4s ease-in-out infinite alternate; }
      @keyframes float { from { transform: translateY(0); } to { transform: translateY(-4px); } }
    </style>
  </defs>
  <g class="f" text-anchor="middle">
    <g class="pop" style="animation-delay:0.1s"><g class="float" style="animation-delay:0s">
      <rect class="card" x="20" y="18" width="270" height="114" rx="16"/>
      <text class="n" x="155" y="80">3</text><text class="l" x="155" y="110">DATASETS</text>
    </g></g>
    <g class="pop" style="animation-delay:0.3s"><g class="float" style="animation-delay:0.6s">
      <rect class="card" x="315" y="18" width="270" height="114" rx="16"/>
      <text class="n" x="450" y="80">1.19 M</text><text class="l" x="450" y="110">NETWORK RECORDS</text>
    </g></g>
    <g class="pop" style="animation-delay:0.5s"><g class="float" style="animation-delay:1.2s">
      <rect class="card" x="610" y="18" width="270" height="114" rx="16"/>
      <text class="n" x="745" y="80">7</text><text class="l" x="745" y="110">TARGETS (2 TO 19 CLASSES)</text>
    </g></g>
    <g class="pop" style="animation-delay:0.7s"><g class="float" style="animation-delay:1.8s">
      <rect class="card" x="905" y="18" width="275" height="114" rx="16"/>
      <text class="n" x="1042" y="80">14</text><text class="l" x="1042" y="110">MODELS (7 DT + 7 ANN)</text>
    </g></g>
  </g>
</svg>
