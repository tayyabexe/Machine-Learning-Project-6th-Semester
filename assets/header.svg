<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="IoT and IIoT Intrusion Detection: Decision Trees and ANN on TON_IoT, Edge-IIoTset and X-IIoTID">
  <defs>
    <!-- Background: deep slate with a slow autumn glow -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="0.55" stop-color="#111a2e"/>
      <stop offset="1" stop-color="#1c1410">
        <animate attributeName="stop-color" values="#1c1410;#0f1d33;#1c1410" dur="12s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <!-- Title gradient: grey -> blue -> sky -> amber -> grey, colours keep changing -->
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9ca3af">
        <animate attributeName="stop-color" values="#9ca3af;#3b82f6;#60a5fa;#f59e0b;#9ca3af" dur="9s" repeatCount="indefinite"/>
      </stop>
      <stop offset="0.5" stop-color="#3b82f6">
        <animate attributeName="stop-color" values="#3b82f6;#60a5fa;#f59e0b;#9ca3af;#3b82f6" dur="9s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#60a5fa">
        <animate attributeName="stop-color" values="#60a5fa;#f59e0b;#9ca3af;#3b82f6;#60a5fa" dur="9s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <!-- Underline bar gradient -->
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6b7280" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#3b82f6">
        <animate attributeName="stop-color" values="#6b7280;#3b82f6;#f59e0b;#6b7280" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#6b7280" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3b82f6" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>

    <!-- One leaf shape, reused with different colours/sizes -->
    <g id="leaf">
      <path d="M0,-12 C7,-9 11,-2 9,5 C7,10 3,12 0,14 C-3,12 -7,10 -9,5 C-11,-2 -7,-9 0,-12 Z"/>
      <path d="M0,-10 L0,16" stroke="#3a1d0a" stroke-width="1.1" stroke-opacity="0.55" fill="none"/>
      <path d="M0,-2 L5,-6 M0,3 L-5,-1 M0,7 L4,4" stroke="#3a1d0a" stroke-width="0.8" stroke-opacity="0.45" fill="none"/>
    </g>

    <style>
      .font { font-family: 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; }
      .sub  { fill: #cbd5e1; font-size: 21px; letter-spacing: 0.5px; }
      .tag  { fill: #93a3b8; font-size: 14px; letter-spacing: 3px; }
      .chip { fill: #0f172a; stroke: #334155; stroke-width: 1; }
      .chipText { fill: #e2e8f0; font-size: 13px; font-weight: 600; }

      .fall  { animation: fall linear infinite; }
      .sway  { animation: sway ease-in-out infinite alternate; }
      .spin  { animation: spin linear infinite; transform-box: fill-box; transform-origin: center; }
      @keyframes fall { from { transform: translateY(-40px); } to { transform: translateY(390px); } }
      @keyframes sway { from { transform: translateX(-22px); } to { transform: translateX(22px); } }
      @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

      .node { animation: pulse 3.2s ease-in-out infinite; }
      @keyframes pulse { 0%,100% { opacity: 0.25; } 50% { opacity: 0.95; } }
      .link { stroke: #3b82f6; stroke-opacity: 0.18; stroke-width: 1; stroke-dasharray: 4 6; animation: dash 6s linear infinite; }
      @keyframes dash { to { stroke-dashoffset: -100; } }

      .scan { animation: scan 7s ease-in-out infinite; }
      @keyframes scan { 0% { transform: translateX(-200px); opacity: 0; } 15% { opacity: 1; } 85% { opacity: 1; } 100% { transform: translateX(1400px); opacity: 0; } }

      .fadeUp { animation: fadeUp 1.4s ease-out both; }
      @keyframes fadeUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
    </style>
  </defs>

  <!-- Card background -->
  <rect width="1200" height="340" rx="22" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="338" rx="21" fill="none" stroke="#334155" stroke-opacity="0.7"/>
  <ellipse cx="600" cy="170" rx="460" ry="150" fill="url(#glow)"/>

  <!-- Network graph in the background (IoT devices talking) -->
  <g>
    <line class="link" x1="90" y1="70" x2="165" y2="150"/>
    <line class="link" x1="165" y1="150" x2="150" y2="250"/>
    <line class="link" x1="165" y1="150" x2="320" y2="60"/>
    <line class="link" x1="1110" y1="80" x2="1040" y2="160"/>
    <line class="link" x1="1040" y1="160" x2="1060" y2="260"/>
    <line class="link" x1="1040" y1="160" x2="890" y2="60"/>
    <circle class="node" cx="90" cy="70" r="4" fill="#60a5fa"/>
    <circle class="node" cx="165" cy="150" r="5" fill="#3b82f6" style="animation-delay:0.6s"/>
    <circle class="node" cx="150" cy="250" r="4" fill="#94a3b8" style="animation-delay:1.2s"/>
    <circle class="node" cx="320" cy="60" r="3.5" fill="#60a5fa" style="animation-delay:1.8s"/>
    <circle class="node" cx="1110" cy="80" r="4" fill="#60a5fa" style="animation-delay:0.3s"/>
    <circle class="node" cx="1040" cy="160" r="5" fill="#3b82f6" style="animation-delay:0.9s"/>
    <circle class="node" cx="1060" cy="260" r="4" fill="#94a3b8" style="animation-delay:1.5s"/>
    <circle class="node" cx="890" cy="60" r="3.5" fill="#60a5fa" style="animation-delay:2.1s"/>
  </g>

  <!-- A soft "packet scan" beam crossing the card -->
  <g class="scan">
    <rect x="0" y="0" width="120" height="340" fill="#60a5fa" fill-opacity="0.05"/>
    <rect x="58" y="0" width="2" height="340" fill="#93c5fd" fill-opacity="0.25"/>
  </g>

  <!-- Text -->
  <g class="font" text-anchor="middle">
    <text class="tag fadeUp" x="600" y="74">MACHINE LEARNING · 6TH SEMESTER PROJECT</text>
    <text class="fadeUp" x="600" y="140" font-size="54" font-weight="800" fill="url(#title)" style="animation-delay:0.2s">IoT / IIoT Intrusion Detection</text>
    <rect class="fadeUp" x="380" y="160" width="440" height="3" rx="1.5" fill="url(#bar)" style="animation-delay:0.35s"/>
    <text class="sub fadeUp" x="600" y="200" style="animation-delay:0.5s">Decision Trees and Neural Networks on three real network-traffic datasets</text>
  </g>

  <!-- Chips: datasets -->
  <g class="font fadeUp" style="animation-delay:0.8s" text-anchor="middle">
    <rect class="chip" x="345" y="232" width="150" height="34" rx="17"/>
    <text class="chipText" x="420" y="254">TON_IoT</text>
    <rect class="chip" x="525" y="232" width="150" height="34" rx="17"/>
    <text class="chipText" x="600" y="254">Edge-IIoTset</text>
    <rect class="chip" x="705" y="232" width="150" height="34" rx="17"/>
    <text class="chipText" x="780" y="254">X-IIoTID</text>
    <text x="600" y="300" font-size="14" fill="#94a3b8">14 models · 7 targets · 1,189,677 rows · scikit-learn</text>
  </g>

  <!-- Falling autumn leaves (outer = fall, middle = sway, inner = spin) -->
  <g class="fall" style="animation-duration:11s; animation-delay:-2s"><g class="sway" style="animation-duration:2.6s"><g class="spin" style="animation-duration:6s"><use xlink:href="#leaf" x="70" y="0" fill="#d97706"/></g></g></g>
  <g class="fall" style="animation-duration:14s; animation-delay:-7s"><g class="sway" style="animation-duration:3.1s"><g class="spin" style="animation-duration:8s"><use xlink:href="#leaf" x="180" y="0" fill="#ea580c" transform="scale(0.8)"/></g></g></g>
  <g class="fall" style="animation-duration:12s; animation-delay:-4s"><g class="sway" style="animation-duration:2.2s"><g class="spin" style="animation-duration:5s"><use xlink:href="#leaf" x="300" y="0" fill="#ca8a04"/></g></g></g>
  <g class="fall" style="animation-duration:16s; animation-delay:-10s"><g class="sway" style="animation-duration:3.6s"><g class="spin" style="animation-duration:9s"><use xlink:href="#leaf" x="460" y="0" fill="#b45309" transform="scale(1.15)"/></g></g></g>
  <g class="fall" style="animation-duration:13s; animation-delay:-1s"><g class="sway" style="animation-duration:2.8s"><g class="spin" style="animation-duration:7s"><use xlink:href="#leaf" x="640" y="0" fill="#f59e0b" transform="scale(0.7)"/></g></g></g>
  <g class="fall" style="animation-duration:15s; animation-delay:-8s"><g class="sway" style="animation-duration:3.3s"><g class="spin" style="animation-duration:6.5s"><use xlink:href="#leaf" x="790" y="0" fill="#dc2626" transform="scale(0.9)"/></g></g></g>
  <g class="fall" style="animation-duration:12.5s; animation-delay:-5s"><g class="sway" style="animation-duration:2.4s"><g class="spin" style="animation-duration:5.5s"><use xlink:href="#leaf" x="930" y="0" fill="#d97706"/></g></g></g>
  <g class="fall" style="animation-duration:17s; animation-delay:-12s"><g class="sway" style="animation-duration:3.8s"><g class="spin" style="animation-duration:10s"><use xlink:href="#leaf" x="1050" y="0" fill="#ea580c" transform="scale(1.1)"/></g></g></g>
  <g class="fall" style="animation-duration:13.5s; animation-delay:-3s"><g class="sway" style="animation-duration:2.9s"><g class="spin" style="animation-duration:7.5s"><use xlink:href="#leaf" x="1150" y="0" fill="#ca8a04" transform="scale(0.75)"/></g></g></g>
</svg>
